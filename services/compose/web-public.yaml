services:
  web-public:
    container_name: web-public
    image: erseco/alpine-php-webserver:latest
    restart: unless-stopped
    networks:
      - backend
    environment:
      TZ: Europe/Berlin
    volumes:
      - "/opt/www-public:/var/www/html"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-public.rule=Host(`data.ffw-it.de`)"
      - "traefik.http.routers.web-public.entrypoints=websecure"
      - "traefik.http.routers.web-public.tls=true"
      - "traefik.http.services.web-public.loadbalancer.server.port=8080"
